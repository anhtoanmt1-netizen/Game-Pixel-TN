<!doctype html><meta charset=utf-8><base href="/"><title>forge</title>
<body style="margin:0;background:#000">
<div id=stage style="position:relative;width:1280px;height:720px;overflow:hidden;--u:12.8"><div id=ui style="position:absolute;inset:0;--u:12.8"></div></div>
<script type=module>
import {createForge} from '../src/forge.js';
import {mountIconDefs} from '../src/icons.js';
import * as I from '../src/items.js';
mountIconDefs();
const cls=new URLSearchParams(location.search).get('cls')||'mage';
const G={gold:900000,mat:{stone:9000},set:{lowfx:false},inv:[],eq:{}};
const it=I.genItem(30,4,'weapon',undefined,cls); it.enh=9; it.id='t1'; G.inv.push(it);
const it2=I.genItem(30,5,'accessory',undefined,cls); it2.enh=15;it2.id='t2';it2.awk=1;it2.awaken=I.rollAwaken();G.inv.push(it2);
window.G=G;window.I=I;window.it=it;
const forge=createForge(document.getElementById('ui'),{G,classId:()=>cls,find:id=>{const x=G.inv.find(i=>i.id===id);return x&&{it:x,where:'inv'}},commit(){},sfx(){}});
window.forge=forge; window.ready=true;
</script>
